<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Khulafaur Rasyidin - Kelas 7</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #16a085;
            --bg-color: #ecf0f1;
            --cell-size: 40px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 5px;
            color: var(--primary-color);
            text-align: center;
        }

        p.subtitle {
            margin-top: 0;
            margin-bottom: 30px;
            color: #7f8c8d;
            font-size: 1.1em;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            max-width: 1000px;
            width: 100%;
        }

        /* Desain Grid TTS */
        .crossword-board {
            display: grid;
            grid-template-columns: repeat(10, var(--cell-size));
            grid-template-rows: repeat(10, var(--cell-size));
            gap: 2px;
            background-color: #bdc3c7;
            padding: 2px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .cell {
            background-color: #fff;
            position: relative;
            width: var(--cell-size);
            height: var(--cell-size);
        }

        .cell.black {
            background-color: var(--primary-color);
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            text-transform: uppercase;
            box-sizing: border-box;
            background: transparent;
        }

        .cell input:focus {
            outline: none;
            background-color: #e8f8f5;
        }

        .cell .number {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 0.75em;
            color: #555;
            font-weight: bold;
            pointer-events: none;
        }

        /* Desain Pertanyaan */
        .clues-container {
            flex: 1;
            min-width: 300px;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .clues-section {
            margin-bottom: 25px;
        }

        .clues-section h3 {
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 5px;
            color: var(--secondary-color);
            margin-top: 0;
        }

        .clues-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .clues-list li {
            margin-bottom: 12px;
            line-height: 1.5;
            font-size: 0.95em;
        }

        .clues-list strong {
            color: var(--primary-color);
            display: inline-block;
            width: 30px;
        }
    </style>
</head>
<body>

    <h1>Teka-Teki Silang PAI</h1>
    <p class="subtitle">Tema: Khulafaur Rasyidin (Kelas 7)</p>

    <div class="container">
        <!-- Papan TTS (10x10) -->
        <div class="crossword-board">
            <!-- Baris 1 -->
            <div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell"><span class="number">1</span><input type="text" maxlength="1"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div>
            
            <!-- Baris 2 -->
            <div class="cell"><span class="number">2</span><input type="text" maxlength="1"></div><div class="cell"><input type="text" maxlength="1"></div><div class="cell"><input type="text" maxlength="1"></div><div class="cell"><input type="text" maxlength="1"></div><div class="cell"><input type="text" maxlength="1"></div><div class="cell"><input type="text" maxlength="1"></div><div class="cell"><input type="text" maxlength="1"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div>
            
            <!-- Baris 3 -->
            <div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell"><input type="text" maxlength="1"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div>
            
            <!-- Baris 4 -->
            <div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell"><span class="number">3</span><input type="text" maxlength="1"></div><div class="cell"><input type="text" maxlength="1"></div><div class="cell"><input type="text" maxlength="1"></div><div class="cell"><input type="text" maxlength="1"></div><div class="cell"><input type="text" maxlength="1"></div><div class="cell black"></div>
            
            <!-- Baris 5 -->
            <div class="cell black"></div><div class="cell"><span class="number">4</span><input type="text" maxlength="1"></div><div class="cell black"></div><div class="cell black"></div><div class="cell"><input type="text" maxlength="1"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div>
            
            <!-- Baris 6 -->
            <div class="cell black"></div><div class="cell"><input type="text" maxlength="1"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div>
            
            <!-- Baris 7 -->
            <div class="cell black"></div><div class="cell"><span class="number">5</span><input type="text" maxlength="1"></div><div class="cell"><input type="text" maxlength="1"></div><div class="cell"><input type="text" maxlength="1"></div><div class="cell"><input type="text" maxlength="1"></div><div class="cell"><input type="text" maxlength="1"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div>
            
            <!-- Baris 8 -->
            <div class="cell black"></div><div class="cell"><input type="text" maxlength="1"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div>
            
            <!-- Baris 9 -->
            <div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div>
            
            <!-- Baris 10 -->
            <div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div><div class="cell black"></div>
        </div>

        <!-- Daftar Pertanyaan -->
        <div class="clues-container">
            <div class="clues-section">
                <h3>Mendatar</h3>
                <ul class="clues-list">
                    <li><strong>2.</strong> Sahabat yang mendapat julukan "Al-Faruq" (pembeda yang hak dan batil). [7 Huruf]</li>
                    <li><strong>3.</strong> Nama kota yang menjadi pusat pemerintahan Ali bin Abi Thalib. [5 Huruf]</li>
                    <li><strong>5.</strong> Julukan "Zun Nurain" (pemilik dua cahaya) diberikan kepada Khalifah... [5 Huruf]</li>
                </ul>
            </div>
            <div class="clues-section">
                <h3>Menurun</h3>
                <ul class="clues-list">
                    <li><strong>1.</strong> Gelar bagi empat khalifah pertama setelah wafatnya Rasulullah SAW. [8 Huruf]</li>
                    <li><strong>4.</strong> Khalifah pertama yang juga bergelar "Ash-Shiddiq". [aa...] [4 Huruf]</li>
                </ul>
            </div>
        </div>
    </div>

</body>
</html>
